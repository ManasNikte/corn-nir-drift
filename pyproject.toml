[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cornnir"
version = "0.1.0"
description = "NIR chemometrics on the Eigenvector corn dataset: preprocessing, PLS vs 1D-CNN, instrument shift, drift detection and calibration transfer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manas Nikte" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4"]

[project.scripts]
cornnir = "cornnir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "data: needs the real corn dataset (downloaded on first use)",
    "slow: trains neural networks or runs full experiments",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E741"]
